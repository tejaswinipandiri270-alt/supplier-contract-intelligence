
services:
  api:
    build: .
    container_name: supplier-contract-api
    env_file:
      - .env
    environment:
      AWS_REGION: eu-west-2
      USE_S3: "true"
      AWS_OPENSEARCH_USE_AWS_AUTH: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build: .
    container_name: supplier-contract-ui
    command:
      - streamlit
      - run
      - app/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
